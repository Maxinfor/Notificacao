<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CONSELHO TUTELAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            padding: 20px; 
            margin: 0; 
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }
        .container { 
            background-color: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn { 
            flex: 1;
            padding: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            background: #e0e0e0; 
            font-weight: bold; 
            font-size: 16px;
        }
        .active-tab { background: #007bff; color: white; }
        input { 
            text-transform: uppercase; 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            font-size: 15px;
        }
        .view { display: none; margin-top: 10px; }
        .active-view { display: block; }
        .item-lista { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            font-size: 15px; 
            background: #fafafa; 
            margin-bottom: 8px; 
            border-radius: 4px; 
        }
        .btn-acao { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 5px; 
            color: white; 
            margin-bottom: 10px; 
            font-size: 15px;
        }
        #listaResultados {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-buttons">
        <button class="tab-btn active-tab" onclick="mostrar('cadastro', event)">CADASTRO</button>
        <button class="tab-btn" onclick="mostrar('pesquisa', event)">PESQUISAR</button>
    </div>

    <div id="cadastro" class="view active-view">
        <h3 style="text-align:center; font-size: 22px; margin-bottom: 20px;">NOVA NOTIFICAÇÃO</h3>
        <input type="text" id="resp" placeholder="RESPONSÁVEL">
        <input type="text" id="crianca" placeholder="CRIANÇA (SE HOUVER)">
        <input type="date" id="data">
        <input type="time" id="horario">
        <input type="text" id="conselheiro" placeholder="CONSELHEIRO(A)">
        <input type="tel" id="telefone" placeholder="TELEFONE (DDD+NUMERO)">
        
        <button class="btn-acao" style="background: #25D366;" onclick="enviarNotificacao()">ENVIAR NOTIFICAÇÃO (WHATSAPP)</button>
        <button class="btn-acao" style="background: #007bff;" onclick="enviarConfirmacao()">CONFIRMAR AO CONSELHEIRO (AZUL)</button>
        <button class="btn-acao" style="background: #6c757d;" onclick="salvarDados()">SALVAR NO SISTEMA</button>
    </div>

    <div id="pesquisa" class="view">
        <h3 style="text-align:center; font-size: 22px; margin-bottom: 20px;">BUSCAR ATENDIMENTOS</h3>
        <input type="text" id="inputBusca" placeholder="DIGITE O NOME DO RESPONSÁVEL..." onkeyup="filtrarLista()">
        <div id="listaResultados"></div>
    </div>
</div>

<script>
    let bancoDados = JSON.parse(localStorage.getItem('atendimentos')) || [];

    function mostrar(id, evt) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
        document.getElementById(id).classList.add('active-view');
        evt.target.classList.add('active-tab');
    }

    function formatarDataBR(data) {
        if (!data) return "";
        const [ano, mes, dia] = data.split('-');
        return `${dia}/${mes}/${ano}`;
    }

    function salvarDados() {
        const novo = {
            resp: document.getElementById('resp').value,
            crianca: document.getElementById('crianca').value,
            data: document.getElementById('data').value,
            hora: document.getElementById('horario').value,
            conselheiro: document.getElementById('conselheiro').value,
            tel: document.getElementById('telefone').value
        };
        bancoDados.push(novo);
        localStorage.setItem('atendimentos', JSON.stringify(bancoDados));
        alert("SALVO COM SUCESSO!");
        document.querySelectorAll('input').forEach(i => {
            if(i.id !== 'inputBusca') i.value = '';
        });
    }

    function enviarNotificacao() {
        const resp = document.getElementById('resp').value;
        const tel = document.getElementById('telefone').value.replace(/\D/g, '');
        const dataFormatada = formatarDataBR(document.getElementById('data').value);
        const msg = `BOM DIA, AQUI É O CONSELHO TUTELAR. VOCÊ ESTÁ SENDO NOTIFICADO(A) A COMPARECER NO DIA ${dataFormatada} ÀS ${document.getElementById('horario').value}.`;
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function enviarConfirmacao() {
        const resp = document.getElementById('resp').value;
        const conselheiro = document.getElementById('conselheiro').value;
        const dataFormatada = formatarDataBR(document.getElementById('data').value);
        const msg = `OLÁ ${conselheiro}, A PRESENÇA DO RESPONSÁVEL ${resp} PARA O ATENDIMENTO DO DIA ${dataFormatada} ÀS ${document.getElementById('horario').value} FOI CONFIRMADA.`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function filtrarLista() {
        const busca = document.getElementById('inputBusca').value.toUpperCase();
        const lista = document.getElementById('listaResultados');
        lista.innerHTML = '';
        
        bancoDados.filter(item => item.resp.toUpperCase().includes(busca)).forEach(item => {
            lista.innerHTML += `<div class="item-lista">
                <strong>RESP: ${item.resp}</strong><br>
                CRIANÇA: ${item.crianca || 'N/A'}<br>
                DATA: ${formatarDataBR(item.data)} | HORA: ${item.hora}<br>
                CONSELHEIRO: ${item.conselheiro}
            </div>`;
        });
    }
</script>

</body>
</html>

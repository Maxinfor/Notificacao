<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CONSELHO TUTELAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .main-container { 
            max-width: 1400px; 
            margin: auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        header h1 { margin: 0; color: #0056b3; font-size: 24px; letter-spacing: 1px; }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .panel {
            background: #fdfdfd;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
        }
        
        h3 { margin-top: 0; color: #444; border-bottom: 2px solid #007bff; padding-bottom: 8px; font-size: 16px; }
        
        label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        input { 
            text-transform: uppercase; 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            font-size: 14px;
        }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }

        .btn-acao { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            margin-bottom: 10px; 
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn-acao:hover { opacity: 0.9; }
        
        .lista-container {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            padding: 10px;
        }
        .item-lista { 
            padding: 12px; 
            border-bottom: 1px solid #eee; 
            font-size: 13px; 
            background: #fafafa; 
            margin-bottom: 8px; 
            border-radius: 4px; 
            border-left: 4px solid #007bff;
        }
        .item-lista:last-child { margin-bottom: 0; }
        
        .btn-limpar {
            background: #dc3545;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1><i class="fas id-card"></i> SISTEMA INTEGRADO - CONSELHO TUTELAR</h1>
    </header>

    <div class="grid-layout">
        <!-- COLUNA DA ESQUERDA: CADASTRO E AÇÕES -->
        <div class="panel">
            <h3><i class="fas fa-user-plus"></i> NOVA NOTIFICAÇÃO E ATENDIMENTO</h3>
            
            <label>RESPONSÁVEL:</label>
            <input type="text" id="resp" placeholder="Nome completo do responsável">
            
            <label>CRIANÇA / ADOLESCENTE (SE HOUVER):</label>
            <input type="text" id="crianca" placeholder="Nome da criança">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>DATA:</label>
                    <input type="date" id="data">
                </div>
                <div style="flex: 1;">
                    <label>HORÁRIO:</label>
                    <input type="time" id="horario">
                </div>
            </div>
            
            <label>CONSELHEIRO(A) RESPONSÁVEL:</label>
            <input type="text" id="conselheiro" placeholder="Nome do conselheiro">
            
            <label>TELEFONE (WhatsApp):</label>
            <input type="tel" id="telefone" placeholder="DDD + Número (Apenas números)">
            
            <button class="btn-acao" style="background: #25D366;" onclick="enviarNotificacao()"><i class="fab fa-whatsapp"></i> ENVIAR NOTIFICAÇÃO (RESPONSÁVEL)</button>
            <button class="btn-acao" style="background: #17a2b8;" onclick="enviarConfirmacao()"><i class="fab fa-whatsapp"></i> AVISAR CONSELHEIRO(A)</button>
            <button class="btn-acao" style="background: #007bff;" onclick="salvarDados()"><i class="fas fa-save"></i> SALVAR NO SISTEMA</button>
        </div>

        <!-- COLUNA DA DIREITA: PESQUISA E REGISTROS -->
        <div class="panel">
            <h3><i class="fas fa-search"></i> BUSCAR ATENDIMENTOS SALVOS</h3>
            
            <label>FILTRAR POR NOME:</label>
            <input type="text" id="inputBusca" placeholder="Digite para filtrar por responsável..." onkeyup="filtrarLista()">
            
            <div class="lista-container" id="listaResultados">
                <!-- Os resultados aparecem aqui -->
            </div>

            <button class="btn-acao btn-limpar" onclick="limparBanco()"><i class="fas fa-trash-alt"></i> LIMPAR TODOS OS REGISTROS</button>
        </div>
    </div>
</div>

<script>
    let bancoDados = JSON.parse(localStorage.getItem('atendimentos')) || [];

    // Carrega a lista automaticamente ao abrir a tela
    window.onload = function() {
        filtrarLista();
    };

    function formatarDataBR(data) {
        if (!data) return "";
        const [ano, mes, dia] = data.split('-');
        return `${dia}/${mes}/${ano}`;
    }

    function salvarDados() {
        const resp = document.getElementById('resp').value;
        if (!resp) {
            alert("Por favor, preencha pelo menos o nome do responsável.");
            return;
        }

        const novo = {
            resp: resp,
            crianca: document.getElementById('crianca').value,
            data: document.getElementById('data').value,
            hora: document.getElementById('horario').value,
            conselheiro: document.getElementById('conselheiro').value,
            tel: document.getElementById('telefone').value
        };
        
        bancoDados.unshift(novo); // Adiciona no topo da lista
        localStorage.setItem('atendimentos', JSON.stringify(bancoDados));
        alert("SALVO COM SUCESSO!");
        
        // Limpar campos
        document.querySelectorAll('input').forEach(i => {
            if(i.id !== 'inputBusca') i.value = '';
        });
        filtrarLista();
    }

    function enviarNotificacao() {
        const resp = document.getElementById('resp').value;
        const tel = document.getElementById('telefone').value.replace(/\D/g, '');
        const dataFormatada = formatarDataBR(document.getElementById('data').value);
        const hora = document.getElementById('horario').value;
        
        if(!tel) {
            alert("Informe o telefone com DDD.");
            return;
        }

        const msg = `BOM DIA, AQUI É O CONSELHO TUTELAR. ${resp ? 'SR(A). ' + resp + ', ' : ''}VOCÊ ESTÁ SENDO NOTIFICADO(A) A COMPARECER NO DIA ${dataFormatada} ÀS ${hora}.`;
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function enviarConfirmacao() {
        const resp = document.getElementById('resp').value;
        const conselheiro = document.getElementById('conselheiro').value;
        const dataFormatada = formatarDataBR(document.getElementById('data').value);
        const hora = document.getElementById('horario').value;
        
        const msg = `OLÁ ${conselheiro || 'CONSELHEIRO(A)'}, O ATENDIMENTO DO RESPONSÁVEL ${resp} FOI AGENDADO PARA O DIA ${dataFormatada} ÀS ${hora}.`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function filtrarLista() {
        const busca = document.getElementById('inputBusca').value.toUpperCase();
        const lista = document.getElementById('listaResultados');
        lista.innerHTML = '';
        
        const filtrados = bancoDados.filter(item => item.resp.toUpperCase().includes(busca));

        if (filtrados.length === 0) {
            lista.innerHTML = '<p style="text-align:center; color: #888; font-size: 13px;">Nenhum atendimento encontrado.</p>';
            return;
        }

        filtrados.forEach((item, index) => {
            lista.innerHTML += `<div class="item-lista">
                <strong>RESP: ${item.resp}</strong><br>
                <span>CRIANÇA: ${item.crianca || 'N/A'}</span><br>
                <span>DATA: ${formatarDataBR(item.data)} | HORA: ${item.hora || 'N/A'}</span><br>
                <span>CONSELHEIRO: ${item.conselheiro || 'N/A'}</span> | 
                <span>TEL: ${item.tel || 'N/A'}</span>
            </div>`;
        });
    }

    function limparBanco() {
        if (confirm("Tem certeza que deseja apagar todo o histórico salvo?")) {
            localStorage.removeItem('atendimentos');
            bancoDados = [];
            filtrarLista();
            alert("Histórico limpo com sucesso!");
        }
    }
</script>

</body>
</html>
